version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dupword
    - errcheck
    - errname
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    revive:
      rules:
        # Doc comments on exported identifiers: catches both a missing one
        # and one that doesn't start with the identifier's name. staticcheck
        # cannot do this — its ST10xx checks only validate the form of a
        # comment that already exists, so a bare exported type passes clean.
        - name: exported
  exclusions:
    generated: lax
    presets:
      # NOTE: the "comments" preset is deliberately absent. It suppresses
      # revive's exported rule entirely, which would silently make the
      # setting above a no-op.
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go # test-only fixtures: mock cookies, temp exec files, marshaled test JSON — not production risk
      - linters:
          - gosec
        text: G602 # false positive: len(args) is validated in parseNameDomainArgs before args[1] is read, gosec can't trace it across the call
      - linters:
          - gosec
        text: G117 # expected: fields are marshaled deliberately (encrypted credential storage), not leaked
      - linters:
          - gosec
        text: G101 # false positive (LOW confidence): capWarning is portal UI copy, not a credential
      - linters:
          - gosec
        text: G404 # non-cryptographic use: window-id mimics the portal's own client-side format, pace jitter is bot-detection avoidance
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
